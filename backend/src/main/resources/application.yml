spring:
  application:
    name: carwash-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:55432/carwash}
    username: ${SPRING_DATASOURCE_USERNAME:carwash_app}
    password: ${SPRING_DATASOURCE_PASSWORD:change_me}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 50

  flyway:
    enabled: true

  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"

app:
  # часовой пояс автомойки: в нём сравниваем время записи с "сейчас"
  time-zone: ${APP_TIME_ZONE:Europe/Moscow}

  jwt:
    secret-base64: ${JWT_SECRET_BASE64}
    issuer: ${JWT_ISSUER:carwash}
    access-minutes: ${ACCESS_TOKEN_MINUTES:15}
    refresh-days: ${REFRESH_TOKEN_DAYS:14}

  bootstrap:
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    name: ${BOOTSTRAP_ADMIN_NAME:System Administrator}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8080}

  security:
    max-failed-attempts: ${LOGIN_MAX_FAILED_ATTEMPTS:5}
    lock-minutes: ${LOGIN_LOCK_MINUTES:15}
    cookie-secure: ${COOKIE_SECURE:false}

  bookings:
    permanent-delete-enabled: ${PERMANENT_DELETE_ENABLED:false}
    max-page-size: 100
    import-max-rows: 5000
    export-max-rows: 10000
